<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookPlaylist — AI Music Curation</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-555YPWGCSN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-555YPWGCSN');
  </script>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">
        <span class="logo-mark">◆</span>
        Book<span class="logo-accent">Playlist</span>
      </a>
      <div id="authSection" class="auth-section">
        <button id="loginBtn" class="btn btn-spotify" onclick="login()">
          <svg class="spotify-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
          Connect Spotify
        </button>
        <div id="userInfo" class="user-info hidden">
          <span class="user-avatar">♪</span>
          <span id="userName"></span>
          <a href="/auth/logout" class="logout-link">Sign out</a>
        </div>
      </div>
    </div>
  </header>

  <main>

    <section class="hero">
      <div class="hero-inner">
        <h1>Every book deserves<br><em>its own soundtrack</em></h1>
        <p class="hero-subtitle">Enter a book and AI will analyse its mood, themes, and atmosphere — then find 15 songs that bring it to life.</p>
      </div>
    </section>

    <section class="form-section">
      <form id="bookForm" onsubmit="handleSubmit(event)">
        <div class="form-card">
          <div class="form-fields">
            <div class="field-group">
              <label for="bookTitle">Book title</label>
              <input
                type="text"
                id="bookTitle"
                placeholder="e.g. The Road"
                autocomplete="off"
                required
              >
            </div>
            <div class="field-group">
              <label for="bookAuthor">Author</label>
              <input
                type="text"
                id="bookAuthor"
                placeholder="e.g. Cormac McCarthy"
                autocomplete="off"
                required
              >
            </div>
          </div>
          <div class="surprise-row">
            <button type="button" class="btn-surprise" onclick="surpriseMe()">Surprise Me</button>
          </div>
          <div class="field-group">
            <label>Music era</label>
            <div class="era-pills" id="eraPills">
              <button type="button" class="era-pill active" data-value="contemporary">Contemporary</button>
              <button type="button" class="era-pill" data-value="pre-1940s">Pre-1940s</button>
              <button type="button" class="era-pill" data-value="1940s-1960s">1940s–60s</button>
              <button type="button" class="era-pill" data-value="1960s-1980s">1960s–80s</button>
              <button type="button" class="era-pill" data-value="1980s-2000s">1980s–2000s</button>
              <button type="button" class="era-pill" data-value="2000s-2020s">2000s–2020s</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="generateBtn">
            <span class="btn-text">Generate Playlist</span>
          </button>
        </div>
      </form>
    </section>

    <section id="loadingSection" class="loading-section hidden">
      <div class="loading-card">
        <div class="loading-animation">
          <div class="wave"></div>
          <div class="wave"></div>
          <div class="wave"></div>
          <div class="wave"></div>
          <div class="wave"></div>
        </div>
        <p id="loadingText" class="loading-text">Analysing your book…</p>
      </div>
    </section>

    <section id="errorSection" class="error-section hidden">
      <div class="error-card">
        <p id="errorText"></p>
        <button class="btn btn-outline" onclick="resetUI()">Try again</button>
      </div>
    </section>

    <section id="resultsSection" class="results-section hidden">

      <div class="analysis-card" id="analysisCard">
        <div class="analysis-header">
          <div class="analysis-book" id="analysisBook"></div>
        </div>
        <div class="analysis-grid" id="analysisGrid"></div>
      </div>

      <div class="playlist-header">
        <h2 class="playlist-title">Your Playlist</h2>
        <div class="playlist-actions">
          <span id="trackCount" class="track-count"></span>
          <button id="shareBtn" class="btn btn-outline" onclick="sharePlaylist()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            Share
          </button>
          <button id="saveBtn" class="btn btn-spotify" onclick="savePlaylist()" disabled>
            <svg class="spotify-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            Save to Spotify
          </button>
        </div>
      </div>

      <div class="songs-grid" id="songsGrid"></div>

    </section>

  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
